name: Build and Deploy Next.js App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Next.js requires these variables at build time for Static Generation
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}

      # ---------------------------------------------------------
      # DEPLOYMENT STEPS GO HERE
      # ---------------------------------------------------------
      # Note: Since this app uses Next.js Server Actions and SSR (Server-Side Rendering),
      # it CANNOT be hosted on GitHub Pages (which only supports static HTML/CSS/JS).
      # You must deploy this to a Node.js hosting environment (like a VPS via SSH/rsync, 
      # AWS, Docker, Render, etc.).
      # 
      # Example: Sync files to your server via rsync
